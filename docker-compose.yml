services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: saylist
      POSTGRES_PASSWORD: saylist
      POSTGRES_DB: saylist
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saylist"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
