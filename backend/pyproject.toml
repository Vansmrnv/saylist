[project]
name = "saylist"
version = "0.1.0"
description = "Turns a small business's dialog into a structured catalog that AI assistants can use."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "TID", "ASYNC", "RUF"]

[tool.ruff.lint.flake8-tidy-imports]
# Absolute imports only: the architecture test reads import paths literally.
ban-relative-imports = "all"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "migrations", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    # Starlette suggests a different httpx package; httpx works and is the standard one.
    "ignore:Using `httpx` with `starlette.testclient`",
]
markers = ["db: needs a running Postgres with migrations applied (make db-up migrate)"]
